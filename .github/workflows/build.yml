name: Build APK + EXE

on:
  workflow_dispatch:      # Actions sahifasidan qo'lda ishga tushirish
  push:
    branches: [main]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform folder
        run: flutter create . --project-name lexiflip --org uz.lexiflip --platforms=android
      - name: Patch Android project (permissions, receivers, desugaring)
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Analyze code
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          cat analyze.log
          if [ $code -ne 0 ]; then
            grep -E "^\s*error" analyze.log | head -40 > aerr.txt
            msg=$(sed 's/%/%25/g' aerr.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Analyze errors::${msg}"
            exit 1
          fi
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          grep -nE "error|Error|What went wrong|FAILURE|Exception|e: " build.log | head -40 > err.txt || true
          tail -40 build.log >> err.txt
          msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=APK build log::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: LexiFlip-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform folder
        run: flutter create . --project-name lexiflip --org uz.lexiflip --platforms=windows
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: LexiFlip-windows
          path: build/windows/x64/runner/Release/

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Prepare files
        run: |
          cp dist/LexiFlip-android-apk/app-release.apk LexiFlip.apk
          (cd dist/LexiFlip-windows && zip -qr ../../LexiFlip-windows.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LexiFlip build ${{ github.run_number }}
          body: |
            **Android:** LexiFlip.apk — telefonga yuklab, o'rnating.
            **Windows:** LexiFlip-windows.zip — oching, lexiflip.exe ni ishga tushiring.
          files: |
            LexiFlip.apk
            LexiFlip-windows.zip
