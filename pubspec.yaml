name: lexiflip
description: Offline-first vocabulary flashcards for Android, Web and Desktop.
publish_to: "none"
version: 2.2.0+7

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local DB (Hive Community Edition — maintained fork of Hive, same API,
  # works on Android, Windows/macOS/Linux and Web via IndexedDB)
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0

  # Networking, TTS, files
  http: ^1.2.2
  flutter_tts: ^4.2.0
  file_picker: ^13.0.0
  uuid: ^4.5.1

  # Daily reminder (Android + Windows)
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # Amiri — book-style Naskh for Arabic (SIL Open Font License, see assets/fonts/Amiri-OFL.txt)
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
